<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Republic Training Logger // Discord Cadre</title>
    <!-- FontAwesome for Military/Sci-Fi Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-deep: #06090e;
            --bg-card: rgba(13, 22, 35, 0.85);
            --bg-card-border: rgba(0, 162, 255, 0.25);
            --primary: #00a2ff;
            --primary-glow: rgba(0, 162, 255, 0.4);
            --accent-green: #10b981;
            --accent-amber: #f59e0b;
            --accent-red: #ef4444;
            --text-main: #e2e8f0;
            --text-muted: #64748b;
            --font-code: 'Consolas', 'Courier New', monospace;
            --font-title: 'Orbitron', 'Cinzel', sans-serif;
        }

        [data-theme="coruscant"] {
            --primary: #dc2626;
            --primary-glow: rgba(220, 38, 38, 0.4);
            --bg-card-border: rgba(220, 38, 38, 0.3);
        }

        [data-theme="212th"] {
            --primary: #f97316;
            --primary-glow: rgba(249, 115, 22, 0.4);
            --bg-card-border: rgba(249, 115, 22, 0.3);
        }

        [data-theme="104th"] {
            --primary: #64748b;
            --primary-glow: rgba(100, 116, 139, 0.4);
            --bg-card-border: rgba(100, 116, 139, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 162, 255, 0.08) 0%, transparent 70%),
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            min-height: 100vh;
            padding: 20px;
        }

        /* Tactical HUD overlay */
        body::after {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%);
            background-size: 100% 4px;
            z-index: 999;
            pointer-events: none;
            opacity: 0.5;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0 25px 0;
            border-bottom: 1px solid var(--bg-card-border);
            margin-bottom: 25px;
            position: relative;
        }

        header::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 180px;
            height: 2px;
            background: var(--primary);
            box-shadow: 0 0 10px var(--primary);
        }

        .logo-group {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .rep-icon {
            font-size: 2.2rem;
            color: var(--primary);
            text-shadow: 0 0 12px var(--primary);
        }

        h1 {
            font-family: var(--font-title);
            letter-spacing: 2px;
            font-size: 1.5rem;
            text-transform: uppercase;
            color: #fff;
        }

        .subtitle {
            font-size: 0.75rem;
            color: var(--primary);
            font-family: var(--font-code);
            letter-spacing: 2px;
        }

        /* Profile & Stats Bar */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            border-radius: 6px;
            padding: 18px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 3px; height: 100%;
            background: var(--primary);
        }

        .card-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-muted);
            font-family: var(--font-code);
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }

        .stat-value {
            font-size: 1.6rem;
            font-weight: bold;
            color: #fff;
            font-family: var(--font-code);
        }

        /* Layout Grid */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 25px;
        }

        @media (max-width: 950px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Form styling */
        .form-section-title {
            font-size: 0.85rem;
            font-family: var(--font-code);
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            border-bottom: 1px dashed rgba(255,255,255,0.1);
            padding-bottom: 4px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
            font-family: var(--font-code);
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            background: rgba(5, 12, 22, 0.9);
            border: 1px solid rgba(0, 162, 255, 0.25);
            border-radius: 4px;
            color: #fff;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 8px var(--primary-glow);
        }

        /* Checklist */
        .checklist-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        @media (max-width: 600px) {
            .checklist-group {
                grid-template-columns: 1fr;
            }
        }

        .check-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 10px;
            border-radius: 4px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .check-item:hover {
            background: rgba(0, 162, 255, 0.05);
            border-color: var(--primary);
        }

        .check-item input[type="checkbox"] {
            width: auto;
            margin-top: 3px;
            cursor: pointer;
        }

        .check-label {
            font-size: 0.85rem;
            color: #cbd5e1;
            line-height: 1.3;
        }

        .check-phase {
            font-size: 0.7rem;
            color: var(--primary);
            font-family: var(--font-code);
            display: block;
            margin-bottom: 2px;
        }

        .btn {
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 12px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-family: var(--font-code);
            transition: all 0.3s;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            background: var(--primary);
            color: var(--bg-deep);
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .btn-discord {
            border-color: #5865F2;
            color: #5865F2;
        }

        .btn-discord:hover {
            background: #5865F2;
            color: #fff;
            box-shadow: 0 0 15px rgba(88, 101, 242, 0.4);
        }

        /* Logs Feed */
        .log-entry {
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            border-radius: 6px;
            padding: 14px;
            margin-bottom: 12px;
            position: relative;
        }

        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 6px;
        }

        .log-recruits {
            font-weight: bold;
            font-size: 0.95rem;
            color: #fff;
        }

        .log-meta {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-family: var(--font-code);
        }

        .status-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 0.7rem;
            font-family: var(--font-code);
            font-weight: bold;
            text-transform: uppercase;
        }

        .status-passed { background: rgba(16, 185, 129, 0.2); color: #10b981; border: 1px solid #10b981; }
        .status-failed { background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid #ef4444; }

        .log-actions {
            margin-top: 10px;
            display: flex;
            gap: 8px;
        }

        .btn-sm {
            padding: 4px 8px;
            font-size: 0.75rem;
            border-radius: 3px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-main);
            cursor: pointer;
            font-family: var(--font-code);
        }

        .btn-sm:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        /* Theme Selector */
        .theme-selector {
            display: flex;
            gap: 8px;
        }

        .dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .dot-501st { background: #00a2ff; }
        .dot-coruscant { background: #dc2626; }
        .dot-212th { background: #f97316; }
        .dot-104th { background: #64748b; }

        .dot.active { border-color: #fff; }

        /* Modal for Output */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #0d1623;
            border: 1px solid var(--primary);
            border-radius: 6px;
            width: 90%;
            max-width: 600px;
            padding: 20px;
            box-shadow: 0 0 30px var(--primary-glow);
        }

        .modal-textarea {
            width: 100%;
            height: 200px;
            background: #04080e;
            color: #00d4ff;
            font-family: var(--font-code);
            font-size: 0.85rem;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid rgba(0, 162, 255, 0.3);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="logo-group">
                <i class="fa-solid fa-shield-halved rep-icon"></i>
                <div>
                    <h1>Grand Republic Log System</h1>
                    <div class="subtitle">CADRE_TRAINING_ASSESSMENT // DISCORD_LOGS</div>
                </div>
            </div>

            <div class="theme-selector">
                <div class="dot dot-501st active" onclick="setTheme('501st')" title="501st Legion (Blue)"></div>
                <div class="dot dot-coruscant" onclick="setTheme('coruscant')" title="Coruscant Guard (Red)"></div>
                <div class="dot dot-212th" onclick="setTheme('212th')" title="212th Battalion (Orange)"></div>
                <div class="dot dot-104th" onclick="setTheme('104th')" title="104th Wolfpack (Grey)"></div>
            </div>
        </header>

        <!-- Stats Bar -->
        <div class="stats-bar">
            <div class="card">
                <div class="card-title">Completed Trainings <i class="fa-solid fa-clipboard-check"></i></div>
                <div class="stat-value" id="stat-total">0</div>
            </div>
            <div class="card">
                <div class="card-title">Passed Cadets <i class="fa-solid fa-user-check"></i></div>
                <div class="stat-value" id="stat-passed" style="color: var(--accent-green);">0</div>
            </div>
            <div class="card">
                <div class="card-title">Failed Cadets <i class="fa-solid fa-user-xmark"></i></div>
                <div class="stat-value" id="stat-failed" style="color: var(--accent-red);">0</div>
            </div>
        </div>

        <!-- Main Layout -->
        <div class="main-grid">
            
            <!-- Left: Training Form -->
            <div class="card">
                <form id="cadre-form">
                    
                    <!-- Personnel -->
                    <div class="form-section-title"><i class="fa-solid fa-users"></i> Personnel Information</div>
                    <div class="grid-2">
                        <div class="form-group">
                            <label>Trainer Username</label>
                            <input type="text" id="trainer-name" placeholder="e.g. CC-2224 Cody" required>
                        </div>
                        <div class="form-group">
                            <label>Trainer Rank</label>
                            <select id="trainer-rank">
                                <option value="Cadet">Cadet</option>
                                <option value="Trooper">Trooper</option>
                                <option value="Corporal">Corporal</option>
                                <option value="Sergeant" selected>Sergeant</option>
                                <option value="Lieutenant">Lieutenant</option>
                                <option value="Captain">Captain</option>
                                <option value="Major">Major</option>
                                <option value="Commander">Commander</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid-2">
                        <div class="form-group">
                            <label>Trained Username(s)</label>
                            <input type="text" id="trained-name" placeholder="e.g. CT-5555 Fives" required>
                        </div>
                        <div class="form-group">
                            <label>Result Outcome</label>
                            <select id="result-status">
                                <option value="PASSED">PASSED (Graduated)</option>
                                <option value="FAILED">FAILED (Needs Retest)</option>
                            </select>
                        </div>
                    </div>

                    <!-- Checklist -->
                    <div class="form-section-title"><i class="fa-solid fa-list-check"></i> Training Phases & Checklist</div>
                    <div class="checklist-group">
                        
                        <label class="check-item">
                            <input type="checkbox" id="chk-p1-facing" checked>
                            <div class="check-label">
                                <span class="check-phase">Phase 1: Drill & Facing</span>
                                Right Face, Left Face, About Face
                            </div>
                        </label>

                        <label class="check-item">
                            <input type="checkbox" id="chk-p1-salute" checked>
                            <div class="check-label">
                                <span class="check-phase">Phase 1: Drill & Facing</span>
                                Saluting & Basic Formations
                            </div>
                        </label>

                        <label class="check-item">
                            <input type="checkbox" id="chk-p2-codes" checked>
                            <div class="check-label">
                                <span class="check-phase">Phase 2: Comms</span>
                                Status Codes (Green, Yellow, Red, Black)
                            </div>
                        </label>

                        <label class="check-item">
                            <input type="checkbox" id="chk-p2-radio" checked>
                            <div class="check-label">
                                <span class="check-phase">Phase 2: Comms</span>
                                Comms Etiquette & Callouts
                            </div>
                        </label>

                        <label class="check-item">
                            <input type="checkbox" id="chk-p3-posts" checked>
                            <div class="check-label">
                                <span class="check-phase">Phase 3: Base Tour</span>
                                Tour of Duty Posts
                            </div>
                        </label>

                        <label class="check-item">
                            <input type="checkbox" id="chk-p3-armory" checked>
                            <div class="check-label">
                                <span class="check-phase">Phase 3: Base Tour</span>
                                Armory & Jedi Temple Locations
                            </div>
                        </label>

                        <label class="check-item">
                            <input type="checkbox" id="chk-p4-joined" checked>
                            <div class="check-label">
                                <span class="check-phase">Phase 4: Discord</span>
                                Joined Discord Server
                            </div>
                        </label>

                        <label class="check-item">
                            <input type="checkbox" id="chk-p4-nick" checked>
                            <div class="check-label">
                                <span class="check-phase">Phase 4: Discord</span>
                                Updated Nickname & Roles Assigned
                            </div>
                        </label>

                    </div>

                    <!-- Additional Remarks -->
                    <div class="form-group">
                        <label>Cadre Notes & Remarks</label>
                        <textarea id="notes" rows="3" placeholder="Add extra details, performance notes, or re-test recommendations..."></textarea>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                        <button type="submit" class="btn">
                            <i class="fa-solid fa-floppy-disk"></i> Save Log
                        </button>
                        <button type="button" class="btn btn-discord" onclick="generateDiscordLogFromForm()">
                            <i class="fa-brands fa-discord"></i> Copy Discord Log
                        </button>
                    </div>

                </form>
            </div>

            <!-- Right: Log History -->
            <div>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                    <h3 style="font-family: var(--font-title); font-size: 1rem;">Recent Telemetry Logs</h3>
                    <button class="btn-sm" onclick="clearLogs()"><i class="fa-solid fa-trash"></i> Clear All</button>
                </div>

                <div id="logs-feed">
                    <!-- Dynamic entries will be inserted here -->
                </div>
            </div>

        </div>
    </div>

    <!-- Modal for Discord Copy -->
    <div class="modal" id="discord-modal">
        <div class="modal-content">
            <h3 style="font-family: var(--font-title); color: #5865F2; margin-bottom: 8px;">
                <i class="fa-brands fa-discord"></i> Discord Format Ready
            </h3>
            <p style="font-size: 0.8rem; color: var(--text-muted);">Kopiera koden nedan och klistra in i er träningskanal på Discord:</p>
            <textarea class="modal-textarea" id="modal-text" readonly></textarea>
            <div style="display: flex; gap: 10px; justify-content: flex-end;">
                <button class="btn-sm" onclick="closeModal()">Stäng</button>
                <button class="btn btn-discord" style="width: auto; padding: 6px 16px;" onclick="copyModalText()">
                    <i class="fa-solid fa-copy"></i> Kopiera Text
                </button>
            </div>
        </div>
    </div>

    <script>
        // Default State
        let logs = JSON.parse(localStorage.getItem('rep_training_logs')) || [
            {
                id: 1,
                trainerName: 'CC-2224 Cody',
                trainerRank: 'Commander',
                trainedName: 'CT-7567 Rex',
                status: 'PASSED',
                date: '2026-10-24',
                checklist: {
                    p1_facing: true, p1_salute: true,
                    p2_codes: true, p2_radio: true,
                    p3_posts: true, p3_armory: true,
                    p4_joined: true, p4_nick: true
                },
                notes: 'Showed excellent command of facing drills and status codes.'
            }
        ];

        // Init
        document.addEventListener('DOMContentLoaded', () => {
            renderLogs();
            updateStats();
        });

        // Save
        function saveLogs() {
            localStorage.setItem('rep_training_logs', JSON.stringify(logs));
            updateStats();
        }

        // Form Submit
        document.getElementById('cadre-form').addEventListener('submit', (e) => {
            e.preventDefault();

            const newLog = getFormData();
            logs.unshift(newLog);
            saveLogs();
            renderLogs();
            alert('Träningslogg sparad!');
        });

        function getFormData() {
            return {
                id: Date.now(),
                trainerName: document.getElementById('trainer-name').value,
                trainerRank: document.getElementById('trainer-rank').value,
                trainedName: document.getElementById('trained-name').value,
                status: document.getElementById('result-status').value,
                date: new Date().toISOString().split('T')[0],
                checklist: {
                    p1_facing: document.getElementById('chk-p1-facing').checked,
                    p1_salute: document.getElementById('chk-p1-salute').checked,
                    p2_codes: document.getElementById('chk-p2-codes').checked,
                    p2_radio: document.getElementById('chk-p2-radio').checked,
                    p3_posts: document.getElementById('chk-p3-posts').checked,
                    p3_armory: document.getElementById('chk-p3-armory').checked,
                    p4_joined: document.getElementById('chk-p4-joined').checked,
                    p4_nick: document.getElementById('chk-p4-nick').checked
                },
                notes: document.getElementById('notes').value
            };
        }

        // Render Feed
        function renderLogs() {
            const container = document.getElementById('logs-feed');
            container.innerHTML = '';

            if (logs.length === 0) {
                container.innerHTML = `
                    <div class="card" style="text-align:center; color: var(--text-muted); padding: 30px;">
                        Inga träningsloggar registrerade än.
                    </div>`;
                return;
            }

            logs.forEach(log => {
                const el = document.createElement('div');
                el.className = 'log-entry';
                const statusClass = log.status === 'PASSED' ? 'status-passed' : 'status-failed';

                el.innerHTML = `
                    <div class="log-header">
                        <div>
                            <div class="log-recruits">Recruit: ${escapeHtml(log.trainedName)}</div>
                            <div class="log-meta">Trainer: [${log.trainerRank}]${escapeHtml(log.trainerName)}</div>
                        </div>
                        <span class="status-badge ${statusClass}">${log.status}</span>
                    </div>
                    <div style="font-size: 0.8rem; color: var(--text-muted); font-family: var(--font-code);">
                        Completed: ${log.date}
                    </div>
                    ${log.notes ? `<div style="font-size: 0.85rem; color: #cbd5e1; margin-top: 6px;">${escapeHtml(log.notes)}</div>` : ''}
                    <div class="log-actions">
                        <button class="btn-sm" onclick="exportSingleDiscord(${log.id})"><i class="fa-brands fa-discord"></i> Export Discord</button>
                        <button class="btn-sm" onclick="deleteLog(${log.id})" style="color:#ef4444;"><i class="fa-solid fa-trash"></i> Delete</button>
                    </div>
                `;
                container.appendChild(el);
            });
        }

        // Stats
        function updateStats() {
            document.getElementById('stat-total').textContent = logs.length;
            const passed = logs.filter(l => l.status === 'PASSED').length;
            const failed = logs.filter(l => l.status === 'FAILED').length;
            document.getElementById('stat-passed').textContent = passed;
            document.getElementById('stat-failed').textContent = failed;
        }

        // Delete
        function deleteLog(id) {
            logs = logs.filter(l => l.id !== id);
            saveLogs();
            renderLogs();
        }

        function clearLogs() {
            if (confirm('Är du säker på att du vill rensa alla sparade loggar?')) {
                logs = [];
                saveLogs();
                renderLogs();
            }
        }

        // Discord Log Generator
        function buildDiscordFormat(data) {
            const c = data.checklist;
            const formatCheck = (val) => val ? '✅' : '❌';

            return ````
==================================================
        GRAND REPUBLIC TRAINING LOG
==================================================
Trainer Username : ${data.trainerName}
Trainer Rank     : ${data.trainerRank}
Trained Username : ${data.trainedName}
Result Outcome   : [ ${data.status} ]
Date             : ${data.date}

        function generateDiscordLogFromForm() {
            const data = getFormData();
            showModal(buildDiscordFormat(data));
        }

        function exportSingleDiscord(id) {
            const log = logs.find(l => l.id === id);
            if (log) {
                showModal(buildDiscordFormat(log));
            }
        }

        // Modal Logic
        function showModal(text) {
            document.getElementById('modal-text').value = text;
            document.getElementById('discord-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('discord-modal').style.display = 'none';
        }

        function copyModalText() {
            const textarea = document.getElementById('modal-text');
            textarea.select();
            document.execCommand('copy');
            alert('Kopierat till urklipp! Klistra in i er Discord-kanal.');
        }

        // Theme Switcher
        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            document.querySelectorAll('.dot').forEach(d => d.classList.remove('active'));
            event.target.classList.add('active');
        }

        // Utility
        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
