<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jedi Archives // Training Logger</title>
    <!-- FontAwesome för ikonerna -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js för statistiken -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-deep: #050b14;
            --bg-card: rgba(10, 25, 47, 0.7);
            --bg-card-border: rgba(0, 212, 255, 0.25);
            --primary: #00d4ff;
            --primary-glow: rgba(0, 212, 255, 0.4);
            --accent-amber: #ffaa00;
            --accent-purple: #a855f7;
            --text-main: #e2e8f0;
            --text-muted: #64748b;
            --font-title: 'Cinzel', 'Trajan Pro', Georgia, serif;
            --font-code: 'Consolas', 'Courier New', monospace;
        }

        [data-theme="sith"] {
            --primary: #ff2a2a;
            --primary-glow: rgba(255, 42, 42, 0.4);
            --bg-card-border: rgba(255, 42, 42, 0.3);
            --accent-amber: #ff6600;
        }

        [data-theme="consular"] {
            --primary: #10b981;
            --primary-glow: rgba(16, 185, 129, 0.4);
            --bg-card-border: rgba(16, 185, 129, 0.3);
        }

        [data-theme="sentinel"] {
            --primary: #f59e0b;
            --primary-glow: rgba(245, 158, 11, 0.4);
            --bg-card-border: rgba(245, 158, 11, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 212, 255, 0.08) 0%, transparent 70%),
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            min-height: 100vh;
            padding: 20px;
        }

        /* Scanline FX */
        body::after {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            z-index: 999;
            pointer-events: none;
            opacity: 0.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0 30px 0;
            border-bottom: 1px solid var(--bg-card-border);
            margin-bottom: 30px;
            position: relative;
        }

        header::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 150px;
            height: 2px;
            background: var(--primary);
            box-shadow: 0 0 10px var(--primary);
        }

        .logo-group {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .holocron-icon {
            font-size: 2.2rem;
            color: var(--primary);
            text-shadow: 0 0 12px var(--primary);
            animation: pulse 3s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); filter: drop-shadow(0 0 4px var(--primary)); }
            100% { transform: scale(1.05); filter: drop-shadow(0 0 14px var(--primary)); }
        }

        h1 {
            font-family: var(--font-title);
            letter-spacing: 2px;
            font-size: 1.8rem;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 0 0 8px rgba(255,255,255,0.3);
        }

        .subtitle {
            font-size: 0.8rem;
            color: var(--primary);
            font-family: var(--font-code);
            letter-spacing: 3px;
        }

        /* Profile & Rank Bar */
        .profile-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            border-radius: 8px;
            padding: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 4px; height: 100%;
            background: var(--primary);
        }

        .card-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: var(--text-muted);
            font-family: var(--font-code);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        .rank-name {
            font-size: 1.4rem;
            font-family: var(--font-title);
            color: #fff;
            margin-bottom: 10px;
        }

        .progress-outer {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-inner {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), #ffffff);
            box-shadow: 0 0 10px var(--primary);
            width: 45%;
            transition: width 0.5s ease;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: #fff;
            font-family: var(--font-code);
        }

        /* Layout Main */
        .main-grid {
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 30px;
        }

        @media (max-width: 900px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Form styling */
        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--primary);
            font-family: var(--font-code);
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            background: rgba(5, 15, 30, 0.8);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 4px;
            color: #fff;
            font-size: 0.95rem;
            transition: all 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 10px var(--primary-glow);
        }

        .btn {
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 12px 24px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-family: var(--font-code);
            transition: all 0.3s;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn:hover {
            background: var(--primary);
            color: var(--bg-deep);
            box-shadow: 0 0 20px var(--primary-glow);
        }

        /* Logs Feed */
        .feed-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .filter-group {
            display: flex;
            gap: 10px;
        }

        .filter-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .filter-btn.active, .filter-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: rgba(0, 212, 255, 0.1);
        }

        .log-entry {
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            border-radius: 6px;
            padding: 16px;
            margin-bottom: 15px;
            position: relative;
            transition: transform 0.2s;
        }

        .log-entry:hover {
            transform: translateX(4px);
            border-color: var(--primary);
        }

        .log-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .log-title {
            font-weight: bold;
            font-size: 1.1rem;
            color: #fff;
        }

        .log-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-family: var(--font-code);
        }

        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 3px;
            font-size: 0.75rem;
            font-family: var(--font-code);
            text-transform: uppercase;
            margin-right: 8px;
        }

        .badge-saber { background: rgba(0, 212, 255, 0.15); color: #00d4ff; border: 1px solid #00d4ff; }
        .badge-force { background: rgba(168, 85, 247, 0.15); color: #a855f7; border: 1px solid #a855f7; }
        .badge-meditation { background: rgba(16, 185, 129, 0.15); color: #10b981; border: 1px solid #10b981; }
        .badge-lore { background: rgba(245, 158, 11, 0.15); color: #f59e0b; border: 1px solid #f59e0b; }

        .log-notes {
            color: #cbd5e1;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-top: 10px;
        }

        .log-xp {
            position: absolute;
            top: 16px;
            right: 16px;
            font-family: var(--font-code);
            color: var(--accent-amber);
            font-weight: bold;
        }

        .delete-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            margin-left: 10px;
            transition: color 0.2s;
        }

        .delete-btn:hover {
            color: #ff4757;
        }

        .chart-container {
            height: 220px;
            margin-top: 20px;
        }

        /* Theme Selector */
        .theme-selector {
            display: flex;
            gap: 8px;
        }

        .dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .dot-guardian { background: #00d4ff; }
        .dot-consular { background: #10b981; }
        .dot-sentinel { background: #f59e0b; }
        .dot-sith { background: #ff2a2a; }

        .dot.active { border-color: #fff; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="logo-group">
                <i class="fa-solid fa-gem holocron-icon"></i>
                <div>
                    <h1>Jedi Archives</h1>
                    <div class="subtitle">TRAINING_LOGGER // v2.5</div>
                </div>
            </div>

            <div class="theme-selector">
                <div class="dot dot-guardian active" onclick="setTheme('guardian')" title="Guardian (Blue)"></div>
                <div class="dot dot-consular" onclick="setTheme('consular')" title="Consular (Green)"></div>
                <div class="dot dot-sentinel" onclick="setTheme('sentinel')" title="Sentinel (Yellow)"></div>
                <div class="dot dot-sith" onclick="setTheme('sith')" title="Sith Order (Red)"></div>
            </div>
        </header>

        <!-- Profile Bar -->
        <div class="profile-bar">
            <div class="card">
                <div class="card-title">Jedi Status <i class="fa-solid fa-shield-halved"></i></div>
                <div class="rank-name" id="rank-display">Jedi Knight</div>
                <div style="font-size: 0.8rem; color: var(--text-muted);">XP to Next Rank: <span id="xp-next">500</span></div>
                <div class="progress-outer">
                    <div class="progress-inner" id="xp-bar"></div>
                </div>
            </div>

            <div class="card">
                <div class="card-title">Total Experience <i class="fa-solid fa-bolt"></i></div>
                <div class="stat-value" id="total-xp">0 XP</div>
                <div style="font-size: 0.8rem; color: var(--text-muted); margin-top: 5px;">Accumulated Force Energy</div>
            </div>

            <div class="card">
                <div class="card-title">Completed Logs <i class="fa-solid fa-scroll"></i></div>
                <div class="stat-value" id="total-logs">0</div>
                <div style="font-size: 0.8rem; color: var(--text-muted); margin-top: 5px;">Recorded Training Sessions</div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-grid">
            <!-- Left Form & Telemetry -->
            <div>
                <div class="card" style="margin-bottom: 25px;">
                    <div class="card-title" style="margin-bottom: 15px;">New Holocron Record</div>
                    <form id="log-form">
                        <div class="form-group">
                            <label>Training Subject</label>
                            <input type="text" id="title" placeholder="e.g. Form III Soresu Practice" required>
                        </div>

                        <div class="form-group">
                            <label>Discipline Category</label>
                            <select id="category">
                                <option value="saber">Lightsaber Combat</option>
                                <option value="force">Force Abilities</option>
                                <option value="meditation">Meditation & Focus</option>
                                <option value="lore">Jedi Code & Archives</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Duration (Minutes)</label>
                            <input type="number" id="duration" placeholder="45" min="5" required>
                        </div>

                        <div class="form-group">
                            <label>Session Notes & Reflection</label>
                            <textarea id="notes" rows="4" placeholder="Document your breakthroughs or struggles..."></textarea>
                        </div>

                        <button type="submit" class="btn">
                            <i class="fa-solid fa-plus"></i> Commit To Archives
                        </button>
                    </form>
                </div>

                <div class="card">
                    <div class="card-title">Discipline Breakdown</div>
                    <div class="chart-container">
                        <canvas id="categoryChart"></canvas>
                    </div>
                </div>
            </div>

            <!-- Right Archives List -->
            <div>
                <div class="feed-header">
                    <h2 style="font-family: var(--font-title); font-size: 1.3rem;">Training Telemetry</h2>
                    <div class="filter-group">
                        <button class="filter-btn active" onclick="filterLogs('all')">All</button>
                        <button class="filter-btn" onclick="filterLogs('saber')">Saber</button>
                        <button class="filter-btn" onclick="filterLogs('force')">Force</button>
                        <button class="filter-btn" onclick="filterLogs('meditation')">Meditation</button>
                    </div>
                </div>

                <div id="logs-container">
                    <!-- Dynamic Log Items will appear here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // State
        let logs = JSON.parse(localStorage.getItem('jedi_logs')) || [
            { id: 1, title: 'Form III Soresu Deflection', category: 'saber', duration: 60, xp: 120, notes: 'Maintained blast-shield focus for 30 consecutive remote droids.', date: '2026-10-20' },
            { id: 2, title: 'Deep Force Telekinesis', category: 'force', duration: 45, xp: 90, notes: 'Lifted 3 heavy rocks during high winds. Focus remained steady.', date: '2026-10-22' }
        ];

        let currentFilter = 'all';
        let chartInstance = null;

        // Elements
        const logForm = document.getElementById('log-form');
        const logsContainer = document.getElementById('logs-container');
        const totalXpEl = document.getElementById('total-xp');
        const totalLogsEl = document.getElementById('total-logs');
        const rankDisplayEl = document.getElementById('rank-display');
        const xpNextEl = document.getElementById('xp-next');
        const xpBarEl = document.getElementById('xp-bar');

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            renderLogs();
            updateStats();
            initChart();
        });

        // Save & Sync
        function saveLogs() {
            localStorage.setItem('jedi_logs', JSON.stringify(logs));
            updateStats();
            updateChart();
        }

        // Add Log
        logForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const title = document.getElementById('title').value;
            const category = document.getElementById('category').value;
            const duration = parseInt(document.getElementById('duration').value);
            const notes = document.getElementById('notes').value;
            
            // Calculate XP (2 XP per min)
            const xp = duration * 2;
            const date = new Date().toISOString().split('T')[0];

            const newLog = {
                id: Date.now(),
                title,
                category,
                duration,
                xp,
                notes,
                date
            };

            logs.unshift(newLog);
            saveLogs();
            renderLogs();
            logForm.reset();
        });

        // Delete Log
        function deleteLog(id) {
            logs = logs.filter(log => log.id !== id);
            saveLogs();
            renderLogs();
        }

        // Render Feed
        function renderLogs() {
            logsContainer.innerHTML = '';
            
            const filteredLogs = currentFilter === 'all' 
                ? logs 
                : logs.filter(l => l.category === currentFilter);

            if (filteredLogs.length === 0) {
                logsContainer.innerHTML = `
                    <div style="text-align: center; color: var(--text-muted); padding: 40px;" class="card">
                        <i class="fa-solid fa-box-open" style="font-size: 2rem; margin-bottom: 10px;"></i>
                        <p>No Holocron telemetry found for this category.</p>
                    </div>`;
                return;
            }

            filteredLogs.forEach(log => {
                const badgeClasses = {
                    saber: 'badge-saber',
                    force: 'badge-force',
                    meditation: 'badge-meditation',
                    lore: 'badge-lore'
                };

                const el = document.createElement('div');
                el.className = 'log-entry';
                el.innerHTML = `
                    <div class="log-header">
                        <span class="log-title">${escapeHtml(log.title)}</span>
                        <div class="log-meta">
                            <span>${log.date}</span>
                            <button class="delete-btn" onclick="deleteLog(${log.id})"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                    <div>
                        <span class="badge ${badgeClasses[log.category]}">${log.category}</span>
                        <span style="font-size: 0.85rem; color: var(--text-muted); font-family: var(--font-code);">${log.duration} MINS</span>
                    </div>
                    ${log.notes ? `<div class="log-notes">${escapeHtml(log.notes)}</div>` : ''}
                    <div class="log-xp">+${log.xp} XP</div>
                `;
                logsContainer.appendChild(el);
            });
        }

        // Calculate Ranks & Stats
        function updateStats() {
            const totalXp = logs.reduce((sum, item) => sum + item.xp, 0);
            totalXpEl.textContent = `${totalXp} XP`;
            totalLogsEl.textContent = logs.length;

            // Rank Thresholds
            const ranks = [
                { name: 'Initiate / Youngling', xp: 0 },
                { name: 'Padawan Learner', xp: 300 },
                { name: 'Jedi Knight', xp: 800 },
                { name: 'Jedi Master', xp: 2000 },
                { name: 'Grand Master', xp: 5000 }
            ];

            let currentRank = ranks[0];
            let nextRank = ranks[1];

            for (let i = 0; i < ranks.length; i++) {
                if (totalXp >= ranks[i].xp) {
                    currentRank = ranks[i];
                    nextRank = ranks[i + 1] || { name: 'Max Rank Reached', xp: totalXp };
                }
            }

            rankDisplayEl.textContent = currentRank.name;
            
            if (nextRank.xp === totalXp) {
                xpNextEl.textContent = 'MAX';
                xpBarEl.style.width = '100%';
            } else {
                const needed = nextRank.xp - currentRank.xp;
                const currentProgress = totalXp - currentRank.xp;
                const percentage = Math.min(Math.max((currentProgress / needed) * 100, 5), 100);
                
                xpNextEl.textContent = `${nextRank.xp - totalXp} XP`;
                xpBarEl.style.width = `${percentage}%`;
            }
        }

        // Filter Logic
        function filterLogs(category) {
            currentFilter = category;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderLogs();
        }

        // Theme Switcher
        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            document.querySelectorAll('.dot').forEach(d => d.classList.remove('active'));
            event.target.classList.add('active');
            updateChart();
        }

        // Utility
        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // Chart.js Telemetry Setup
        function initChart() {
            const ctx = document.getElementById('categoryChart').getContext('2d');
            chartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: getChartData(),
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: { color: '#94a3b8', font: { family: 'Consolas' } }
                        }
                    },
                    cutout: '70%'
                }
            });
        }

        function getChartData() {
            const counts = { saber: 0, force: 0, meditation: 0, lore: 0 };
            logs.forEach(l => { if (counts[l.category] !== undefined) counts[l.category] += l.duration; });

            const primaryColor = getComputedStyle(document.documentElement).getPropertyValue('--primary').trim();

            return {
                labels: ['Saber', 'Force', 'Meditation', 'Lore'],
                datasets: [{
                    data: [counts.saber, counts.force, counts.meditation, counts.lore],
                    backgroundColor: [
                        primaryColor || '#00d4ff',
                        '#a855f7',
                        '#10b981',
                        '#f59e0b'
                    ],
                    borderWidth: 0
                }]
            };
        }

        function updateChart() {
            if (chartInstance) {
                chartInstance.data = getChartData();
                chartInstance.update();
            }
        }
    </script>
</body>
</html>
